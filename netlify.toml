# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."

# Security headers for every response. The CSP is tight because the site runs no
# JavaScript at all: the only external origins are Google Fonts (the Amiri
# stylesheet, and the font files it pulls from fonts.gstatic.com).
# 'unsafe-inline' in style-src covers the handful of inline style attributes in
# index.html — inline attributes cannot be hashed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

# Fingerprint-free assets, but they only change when the app does — cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate so copy edits go live on the next deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
